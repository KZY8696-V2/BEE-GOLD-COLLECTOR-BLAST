name: Neo Geo CD Build Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # GitHub arayüzünden el ile tetikleme desteği

jobs:
  build-neogeocd:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository kodlarını GitHub runner'ına çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Linux ortamı için gerekli derleme ve ISO araçlarını kur
      - name: Install Build and ISO Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git genisoimage

      # 3. VASM assembler'ını kaynak kodundan klonla ve derle (Doğru dosya adı ile)
      - name: Build VASM Assembler
        run: |
          git clone https://github.com/dbuchwald/vasm.git
          cd vasm
          make CPU=m68k SYNTAX=mot
          # DÜZELTME: Oluşan dosya adı 'vasmm68k_mot' (alt çizgisizdir)
          sudo cp vasmm68k_mot /usr/local/bin/vasmm68k_mot
          cd ..

      # 4. Ana Assembly kodunu VASM ile Motorola 68k formatında derle
      - name: Compile BGC Blast Assembly Code
        run: |
          # main.s dosyanın adı farklıysa (örn: bgc_blast.s) burayı değiştirebilirsin
          vasmm68k_mot -Fbin -nosym -o BGC_BLAST.BIN main.s

      # 5. Neo Geo CD için gerekli IPL.TXT, BUILD.TXT ve CUE dosyalarını otomatik oluştur
      - name: Generate Neo Geo CD Configuration Files
        run: |
          # IPL.TXT Boot Yapılandırması
          echo "; ===================================================" > IPL.TXT
          echo "; NEO GEO CD IPL.TXT - AUTO GENERATED BY GITHUB ACTIONS" >> IPL.TXT
          echo "; ===================================================" >> IPL.TXT
          echo "BOOT=CDROM:/BGC_BLAST.BIN" >> IPL.TXT
          echo "PRG=CDROM:/BGC_BLAST.BIN" >> IPL.TXT
          echo "LOAD_ADDR=0x0010f000" >> IPL.TXT
          echo "EXEC_ADDR=0x00000000" >> IPL.TXT

          # BUILD.TXT Yapılandırması
          echo "; ===================================================" > BUILD.TXT
          echo "; NEO GEO CD BUILD.TXT - AUTO GENERATED BY GITHUB ACTIONS" >> BUILD.TXT
          echo "; ===================================================" >> BUILD.TXT
          echo "BOOT=CDROM:/BGC_BLAST.BIN" >> BUILD.TXT
          echo "PRG=CDROM:/BGC_BLAST.BIN" >> BUILD.TXT
          echo "LOAD_ADDR=0x0010f000" >> BUILD.TXT
          echo "EXEC_ADDR=0x00000000" >> BUILD.TXT

          # BGC_BLAST.CUE Dosyası
          echo 'FILE "bgc_blast.iso" BINARY' > bgc_blast.cue
          echo '  TRACK 01 MODE1/2352' >> bgc_blast.cue
          echo '    INDEX 01 00:00:00' >> bgc_blast.cue

      # 6. Neo Geo CD uyumlu ISO imajını (ISO-9660) paketle
      - name: Package Neo Geo CD ISO Image
        run: |
          genisoimage -o bgc_blast.iso -V "BGC_BLAST" -no-emul-boot -iso-level 1 .

      # 7. Üretilen tüm kritik dosyaları (ISO, CUE, IPL.TXT, BUILD.TXT, BIN) Artifact olarak kaydet
      - name: Upload Neo Geo CD Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-geo-cd-bgc-blast-package
          path: |
            bgc_blast.iso
            bgc_blast.cue
            IPL.TXT
            BUILD.TXT
            BGC_BLAST.BIN
