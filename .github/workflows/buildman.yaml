name: Neo Geo CD Build Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # GitHub arayüzünden el ile tetikleme desteği

jobs:
  build-neogeocd:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository kodlarını GitHub runner'ına çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Linux ortamı için gerekli derleme araçlarını kur (ISO aracı kaldırıldı)
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      # 3. VASM assembler'ını kaynak kodundan klonla ve derle
      - name: Build VASM Assembler
        run: |
          git clone https://github.com/dbuchwald/vasm.git
          cd vasm
          make CPU=m68k SYNTAX=mot
          sudo cp vasmm68k_mot /usr/local/bin/vasmm68k_mot
          cd ..

      # 4. Ana Assembly kodunu VASM ile derle (8.3 Standart Uyumu: BGCBLAST.BIN)
      - name: Compile BGC Blast Assembly Code
        run: |
          vasmm68k_mot -Fbin -nosym -o BGCBLAST.BIN main.s

      # 5. Neo Geo CD için IPL.TXT, BUILD.TXT ve CUE dosyalarını doğrudan BIN odaklı oluştur
      - name: Generate Neo Geo CD Configuration Files
        run: |
          # IPL.TXT Boot Yapılandırması (Tam parametreli ve 8.3 uyumlu)
          echo "CDROM" > IPL.TXT
          echo "BOOT=CDROM:/BGCBLAST.BIN" >> IPL.TXT
          echo "PRG=CDROM:/BGCBLAST.BIN" >> IPL.TXT
          echo "LOAD_ADDR=0x0010f000" >> IPL.TXT
          echo "EXEC_ADDR=0x00000000" >> IPL.TXT

          # BUILD.TXT Yapılandırması
          echo "CDROM" > BUILD.TXT
          echo "BOOT=CDROM:/BGCBLAST.BIN" >> BUILD.TXT
          echo "PRG=CDROM:/BGCBLAST.BIN" >> BUILD.TXT
          echo "LOAD_ADDR=0x0010f000" >> BUILD.TXT
          echo "EXEC_ADDR=0x00000000" >> BUILD.TXT

          # BGCBLAST.CUE Dosyası (Doğrudan BIN dosyasını ve 2352 RAW sektör modunu gösterir)
          echo 'FILE "BGCBLAST.BIN" BINARY' > bgc_blast.cue
          echo '  TRACK 01 MODE1/2352' >> bgc_blast.cue
          echo '    INDEX 01 00:00:00' >> bgc_blast.cue

      # 6. Sadece BIN, CUE, IPL ve BUILD dosyalarını Artifact olarak kaydet (ISO yok!)
      - name: Upload Neo Geo CD Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-geo-cd-bgc-blast-raw-package
          path: |
            bgc_blast.cue
            IPL.TXT
            BUILD.TXT
            BGCBLAST.BIN
