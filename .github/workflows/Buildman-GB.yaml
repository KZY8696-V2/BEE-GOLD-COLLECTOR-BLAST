name: KGAMER BGC Blast Full Native Build (DMG, CGB & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Install RGBDS, Download hardware.inc and Compile
        run: |
            choco install rgbds -y
            
            $rgbdsPath = "C:\ProgramData\chocolatey\lib\rgbds\rgbds"
            if (!(Test-Path $rgbdsPath)) {
                $rgbdsPath = "C:\ProgramData\chocolatey\bin"
            }
            echo "$rgbdsPath" >> $env:GITHUB_PATH
            $env:Path += ";$rgbdsPath"

            # hardware.inc dosyasını doğrudan çalışma dizinine indir
            curl.exe -L -o hardware.inc "https://raw.githubusercontent.com/gbdev/hardware.inc/master/hardware.inc"

            New-Item -ItemType Directory -Force -Path "rom_outputs"

            # 1. Object Dosyasını Derle (Küçük harf -i parametresi ile)
            rgbasm -i . -o main.o BGC-BLAST-GB.asm

            # 2. DMG Sürümü
            rgblink -p 0xFF -m rom_outputs/bgc_blast_DMG.map -n rom_outputs/bgc_blast_DMG.sym -o rom_outputs/bgc_blast_DMG.gb main.o
            rgbfix -v -p 0xFF -t "BGC BLAST DMG" -c -i 01 -k 01 rom_outputs/bgc_blast_DMG.gb

            # 3. CGB Sürümü
            rgblink -p 0xFF -m rom_outputs/bgc_blast_CGB.map -n rom_outputs/bgc_blast_CGB.sym -o rom_outputs/bgc_blast_CGB.gb main.o
            rgbfix -v -p 0xFF -t "BGC BLAST CGB" -C -i 01 -k 01 rom_outputs/bgc_blast_CGB.gb

            # 4. ALL Evrensel Master ROM Sürümü
            rgblink -p 0xFF -m rom_outputs/bgc_blast_ALL.map -n rom_outputs/bgc_blast_ALL.sym -o rom_outputs/bgc_blast_ALL.gb main.o
            rgbfix -v -p 0xFF -t "BGC BLAST ALL" -C -i 01 -k 01 rom_outputs/bgc_blast_ALL.gb

      - name: Upload Built ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-native-roms
          path: rom_outputs/
