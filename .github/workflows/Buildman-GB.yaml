name: KGAMER BGC Blast Full Native Build (DMG, CGB & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile Target-Specific & Universal Master ROMs (Clean & Direct)
        run: |
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # ---------------------------------------------------------
          # 1. DMG Sürümü (Orijinal Game Boy + SGB + MBC5)
          # ---------------------------------------------------------
          Write-Output "Building DMG Version..."
          sdcc -msm83 --no-std-crt0 --callee-saves-macro -Wl-yt0x1B -Wl-yo4 -Wl-js -Wl"-b _CODE=0x0200" -Wl"-b _DATA=0xC000" -Lk C:\gbdk\lib\gb -lgbz80.lib crt0.rel BGC-BLAST-GB.c -o rom_outputs/bgc_blast_DMG.ihx
          makebin -Z -yt 0x1B -yo 4 rom_outputs/bgc_blast_DMG.ihx rom_outputs/bgc_blast_DMG.gb

          # ---------------------------------------------------------
          # 2. CGB Sürümü (Game Boy Color + SGB + MBC5)
          # ---------------------------------------------------------
          Write-Output "Building CGB Version..."
          sdcc -msm83 --no-std-crt0 --callee-saves-macro -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -Wl"-b _CODE=0x0200" -Wl"-b _DATA=0xC000" -Lk C:\gbdk\lib\gb -lgbz80.lib crt0.rel BGC-BLAST-GB.c -o rom_outputs/bgc_blast_CGB.ihx
          makebin -Z -yc -yt 0x1B -yo 4 rom_outputs/bgc_blast_CGB.ihx rom_outputs/bgc_blast_CGB.gb

          # ---------------------------------------------------------
          # 3. ALL Sürümü (Evrensel Master ROM)
          # ---------------------------------------------------------
          Write-Output "Building ALL Universal Master ROM..."
          sdcc -msm83 --no-std-crt0 --callee-saves-macro -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -Wl"-b _CODE=0x0200" -Wl"-b _DATA=0xC000" -Lk C:\gbdk\lib\gb -lgbz80.lib crt0.rel BGC-BLAST-GB.c -o rom_outputs/bgc_blast_ALL.ihx
          makebin -Z -yc -yt 0x1B -yo 4 rom_outputs/bgc_blast_ALL.ihx rom_outputs/bgc_blast_ALL.gb

      - name: Upload Built ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-native-roms
          path: rom_outputs/
