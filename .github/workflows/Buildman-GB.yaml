name: KGAMER BGC Blast Full Native Build (DMG, CGB & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile with GBDK (Direct & Clean)
        run: |
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # LCC yerine doğrudan GBDK'nın kendi dahili derleyicisini tertemiz çalıştırıyoruz:
          C:\gbdk\bin\lcc -msm83:gb -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_DMG.gb BGC-BLAST-GB.c
          C:\gbdk\bin\lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_CGB.gb BGC-BLAST-GB.c
          C:\gbdk\bin\lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_ALL.gb BGC-BLAST-GB.c


      - name: Upload Built ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-native-roms
          path: rom_outputs/
