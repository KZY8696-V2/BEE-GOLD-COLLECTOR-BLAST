name: KGAMER BGC Blast Full Native Build (DMG, CGB & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile Target-Specific & Universal Master ROMs (No lcc / Direct Toolchain)
        run: |
          # Çıktı klasörünü oluştur
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # GBDK kütüphane yolu
          $LIB_PATH = "C:\gbdk\lib\gb"

          # ---------------------------------------------------------
          # 1. DMG Sürümü (Original Game Boy + SGB + Link)
          # ---------------------------------------------------------
          Write-Output "Building DMG Version..."
          sdcc -mgbz80 --no-std-crt0 --callee-saves-macro -Wl-yt0x1B -Wl-yo4 -Wl-js -c BGC-BLAST-GB.c -o dmg_main.rel
          sdldgb -m -w -i -y -b _CODE=0x0200 -b _DATA=0xC000 -k $LIB_PATH -lgbz80.lib crt0.rel dmg_main.rel
          makebin -p -y -v dmg_main.ihx rom_outputs/bgc_blast_DMG.gb

          # ---------------------------------------------------------
          # 2. CGB Sürümü (Game Boy Color + SGB + Link)
          # ---------------------------------------------------------
          Write-Output "Building CGB Version..."
          sdcc -mgbz80 --no-std-crt0 --callee-saves-macro -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -c BGC-BLAST-GB.c -o cgb_main.rel
          sdldgb -m -w -i -y -b _CODE=0x0200 -b _DATA=0xC000 -k $LIB_PATH -lgbz80.lib crt0.rel cgb_main.rel
          makebin -p -y -v cgb_main.ihx rom_outputs/bgc_blast_CGB.gb

          # ---------------------------------------------------------
          # 3. "ALL" Sürümü (Universal Master ROM for All Systems)
          # ---------------------------------------------------------
          Write-Output "Building ALL Universal Master ROM..."
          sdcc -mgbz80 --no-std-crt0 --callee-saves-macro -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -c BGC-BLAST-GB.c -o all_main.rel
          sdldgb -m -w -i -y -b _CODE=0x0200 -b _DATA=0xC000 -k $LIB_PATH -lgbz80.lib crt0.rel all_main.rel
          makebin -p -y -v all_main.ihx rom_outputs/bgc_blast_ALL.gb

      - name: Upload Built ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-native-roms
          path: rom_outputs/
