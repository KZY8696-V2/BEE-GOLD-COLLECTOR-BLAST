name: BGC Blast Full Build Pipeline (DMG, CGB & Universal)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. Depoyu Klonla
        uses: actions/checkout@v4

      - name: 2. Çıktı Klasörünü Oluştur
        run: mkdir rom_outputs

      - name: 3. Resmi hardware.inc ve Donanım Uyumluluk Dosyalarını İndir
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/gbdev/hardware.inc/master/hardware.inc" -OutFile "hardware.inc"
          Write-Host "hardware.inc basariyla indirildi.[span_0](start_span)"[span_0](end_span)

          if (-not (Test-Path "hardware_compat.inc")) {
              New-Item -ItemType File -Name "hardware_compat.inc" -Force
              Write-Host "hardware_compat.inc olusturuldu."
          }

      - name: 4. RGBDS Araç Zincirini Kur (Chocolatey)
        run: |
          # windows-latest üzerinde choco zaten hazırdır, doğrudan paketleri kuruyoruz
          choco install rgbds -y
          
          # Komut satırı yollarını (PATH) güncel oturuma yansıt
          echo "C:\ProgramData\chocolatey\lib\rgbds\tools" >> $env:GITHUB_PATH

      - name: 5. ROM Sürümlerini Derle ve Mühürle
        run: |
          Write-Host "--- 1. DMG (Klasik Game Boy) Sürümü Derleniyor ---"
          rgbasm -D TARGET_DMG=1 -o build_dmg.o BGC-BLAST-GB.asm
          rgblink -o rom_outputs/BGC-BLAST-DMG.gb build_dmg.o
          rgbfix -v -p 0xFF rom_outputs/BGC-BLAST-DMG.gb

          Write-Host "--- 2. CGB (Game Boy Color) Sürümü Derleniyor ---"
          rgbasm -D TARGET_CGB=1 -o build_cgb.o BGC-BLAST-GB.asm
          rgblink -o rom_outputs/BGC-BLAST-CGB.gb build_cgb.o
          rgbfix -v -c -p 0xFF rom_outputs/BGC-BLAST-CGB.gb

          Write-Host "--- 3. Universal (Evrensel / Tüm Sistemler) Sürüm Derleniyor ---"
          rgbasm -D TARGET_ALL=1 -o build_all.o BGC-BLAST-GB.asm
          rgblink -o rom_outputs/BGC-BLAST-Universal.gb build_all.o
          rgbfix -v -p 0xFF rom_outputs/BGC-BLAST-Universal.gb

      - name: 6. Tüm Sürümleri Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: BGC-BLAST-All-Versions-ROMs
          path: rom_outputs/*.gb
