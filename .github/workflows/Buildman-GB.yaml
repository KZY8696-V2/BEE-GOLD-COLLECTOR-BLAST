name: Build-native-roms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RGBDS via Chocolatey and Compile ROMs
        shell: pwsh
        run: |
          # Chocolatey ile resmi Windows RGBDS paketini kur
          choco install rgbds -y

          # RGBDS yolunu PATH'e ekle
          $rgbdsPath = "C:\ProgramData\chocolatey\lib\rgbds\rgbds"
          if (!(Test-Path $rgbdsPath)) {
              $rgbdsPath = "C:\ProgramData\chocolatey\bin"
          }
          echo "$rgbdsPath" >> $env:GITHUB_PATH
          $env:Path += ";$rgbdsPath"

          # hardware.inc dosyasının varlığını kontrol et, yoksa indir
          if (!(Test-Path "hardware.inc")) {
              Write-Host "hardware.inc bulunamadı, indiriliyor..."
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/gbdev/hardware.inc/master/hardware.inc" -OutFile "hardware.inc"
          } else {
              Write-Host "hardware.inc yerel repodan okunuyor."
          }

          # Çıktı klasörünü oluştur
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # 1. Object Dosyasını Derle
          rgbasm -i . -o main.o BGC-BLAST-GB.asm

          # 2. DMG Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_DMG.map -n rom_outputs/bgc_blast_DMG.sym -o rom_outputs/bgc_blast_DMG.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST DMG" -c -i 01 -k 01 rom_outputs/bgc_blast_DMG.gb

          # 3. CGB Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_CGB.map -n rom_outputs/bgc_blast_CGB.sym -o rom_outputs/bgc_blast_CGB.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST CGB" -C -i 01 -k 01 rom_outputs/bgc_blast_CGB.gb

          # 4. ALL Evrensel Master ROM Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_ALL.map -n rom_outputs/bgc_blast_ALL.sym -o rom_outputs/bgc_blast_ALL.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST ALL" -C -i 01 -k 01 rom_outputs/bgc_blast_ALL.gb


      - name: Upload ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-roms
          path: rom_outputs/
