name: Build-native-roms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install RGBDS Manually and Compile ROMs
        run: |
          # 1. Gerekli araçları kur
          sudo apt-get update
          sudo apt-get install -y curl unzip

          # 2. Resmi RGBDS Linux binary paketini indir ve aç (v0.5.2 veya stabil sürüm)
          curl -L -o rgbds.zip "https://github.com/gbdev/rgbds/releases/download/v0.5.2/rgbds-0.5.2-linux-amd64.tar.gz"
          # Not: Eğer tar.gz ise direkt tar ile açalım:
          curl -L -o rgbds.tar.gz "https://github.com/gbdev/rgbds/releases/download/v0.5.2/rgbds-0.5.2-linux-x86_64.tar.gz"
          tar -xzf rgbds.tar.gz
          
          # Binary dosyalarını /usr/local/bin altına taşı ki her yerden erişilebilsin
          sudo cp rgbds-*-linux-x86_64/rgbasm /usr/local/bin/
          sudo cp rgbds-*-linux-x86_64/rgblink /usr/local/bin/
          sudo cp rgbds-*-linux-x86_64/rgbfix /usr/local/bin/

          # 3. Resmi hardware.inc dosyasını indir
          curl -L -o hardware.inc "https://raw.githubusercontent.com/gbdev/hardware.inc/master/hardware.inc"

          mkdir -p rom_outputs

          # 4. Object Dosyasını Derle
          rgbasm -i . -o main.o BGC-BLAST-GB.asm

          # 5. DMG Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_DMG.map -n rom_outputs/bgc_blast_DMG.sym -o rom_outputs/bgc_blast_DMG.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST DMG" -c -i 01 -k 01 rom_outputs/bgc_blast_DMG.gb

          # 6. CGB Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_CGB.map -n rom_outputs/bgc_blast_CGB.sym -o rom_outputs/bgc_blast_CGB.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST CGB" -C -i 01 -k 01 rom_outputs/bgc_blast_CGB.gb

          # 7. ALL Evrensel Master ROM Sürümü
          rgblink -p 0xFF -m rom_outputs/bgc_blast_ALL.map -n rom_outputs/bgc_blast_ALL.sym -o rom_outputs/bgc_blast_ALL.gb main.o
          rgbfix -v -p 0xFF -t "BGC BLAST ALL" -C -i 01 -k 01 rom_outputs/bgc_blast_ALL.gb

      - name: Upload ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-roms
          path: rom_outputs/
