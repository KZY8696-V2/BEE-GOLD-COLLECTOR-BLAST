name: KGAMER BGC Blast Complete Build (DMG, CGB, GBA & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all-and-universal-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile Target-Specific & ALL Universal ROMs (KGAMER Edition)
        run: |
          # Create output directory
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # ---------------------------------------------------------
          # 1. DMG Version (Original Game Boy + SGB + Link)
          # lcc doğrudan MBC5 (-Wl-yt0x1B), ROM bank (-Wl-yo4) ve SGB (-Wl-js) parametrelerini yönetir
          # ---------------------------------------------------------
          lcc -msm83:gb -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_DMG.gb BGC-BLAST-GB.c

          # ---------------------------------------------------------
          # 2. CGB Version (Game Boy Color + SGB + Link)
          # ---------------------------------------------------------
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_CGB.gb BGC-BLAST-GB.c

          # ---------------------------------------------------------
          # 3. GBA Version (Game Boy Advance Optimized + SGB + Link)
          # ---------------------------------------------------------
          lcc -msm83:gb -Wm-yC -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_GBA.gb BGC-BLAST-GB.c

          # ---------------------------------------------------------
          # 4. "ALL" Version: Universal Master ROM for All Systems
          # ---------------------------------------------------------
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o rom_outputs/bgc_blast_ALL.gb BGC-BLAST-GB.c

      - name: Upload All and Universal ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-all-roms
          path: rom_outputs/
