name: Build NES ROM for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Proje dosyalarını çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. cc65'i GitHub Releases üzerinden doğrudan indir ve kur
      - name: Download and Setup cc65 Binary
        run: |
          $url = "https://github.com/cc65/cc65/releases/latest/download/cc65-snapshot-win32.zip"
          Write-Host "cc65 indiriliyor: $url"
          Invoke-WebRequest -Uri $url -OutFile "cc65.zip"
          
          Write-Host "ZIP ayıklanıyor..."
          Expand-Archive -Path "cc65.zip" -DestinationPath "C:\cc65_extracted"
          
          # Çıkan klasör yapısını bul ve bin dizinini PATH'e ekle
          $binPath = (Get-ChildItem -Path "C:\cc65_extracted" -Recurse -Directory | Where-Object { $_.Name -eq "bin" }).FullName
          Write-Host "cc65 bin yolu: $binPath"
          echo $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      # 3. BGC_BLAST_NES.asm dosyasını ca65 ve ld65 ile derle
      - name: Compile NES ROM
        run: |
          ca65 BGC_BLAST_NES.asm -o bgc_blast_nes.o
          ld65 -C nes.cfg bgc_blast_nes.o -o bgc_blast.nes

      # 4. Oluşan ROM'u Artifact olarak yükle
      - name: Upload NES ROM
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-windows-rom
          path: bgc_blast.nes
