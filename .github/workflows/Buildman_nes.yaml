name: Build NES ROM for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Hazır cc65 Windows paketini güvenli mirror üzerinden anında indir ve kur
      - name: Setup cc65 Toolchain
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "cc65 araç seti indiriliyor..."
          Invoke-WebRequest -Uri "https://github.com/V60/cc65-win32/raw/master/cc65.zip" -OutFile "cc65.zip"
          Expand-Archive -Path "cc65.zip" -DestinationPath "C:\cc65"
          
          $binPath = "C:\cc65\bin"
          echo $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          Write-Host "cc65 PATH dizinine eklendi: $binPath"

      # ca65 ve ld65 ile BGC_BLAST_NES.asm dosyasını derle
      - name: Compile NES ROM
        run: |
          ca65 BGC_BLAST_NES.asm -o bgc_blast_nes.o
          ld65 -C nes.cfg bgc_blast_nes.o -o bgc_blast.nes

      # Oluşan ROM dosyasını Artifact olarak kaydet
      - name: Upload NES ROM
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-windows-rom
          path: bgc_blast.nes
