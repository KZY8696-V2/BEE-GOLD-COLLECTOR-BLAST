name: Build NES ROM for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Proje dosyalarını çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Chocolatey kullanarak cc65 paketini resmi kaynaktan güvenle kur
      - name: Install cc65 via Chocolatey
        run: |
          choco install cc65 -y
          # cc65 bin yolunu PATH değişkenine ekle
          echo "C:\Program Files (x86)\cc65\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          # Alternatif yükleme yolları için environment kontrolü
          if (Test-Path "C:\cc65\bin") { echo "C:\cc65\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      # 3. Yeni dosya adınızla (BGC_BLAST_NES.asm) ca65 ve ld65 ile derle
      - name: Compile NES ROM
        run: |
          ca65 BGC_BLAST_NES.asm -o bgc_blast_nes.o
          ld65 -C nes.cfg bgc_blast_nes.o -o bgc_blast.nes

      # 4. Oluşan ROM'u Artifact olarak yükle
      - name: Upload NES ROM
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-windows-rom
          path: bgc_blast.nes
