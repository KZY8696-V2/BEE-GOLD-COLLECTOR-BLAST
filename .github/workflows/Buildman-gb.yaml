name: KGAMER BGC Blast Complete Build (DMG, CGB, GBA & ALL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all-and-universal-roms:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile Target-Specific & ALL Universal ROMs (KGAMER Edition)
        run: |
          # Çıktı klasörünü oluştur
          New-Item -ItemType Directory -Force -Path "rom_outputs"

          # 1. DMG Sürümü (Orijinal Game Boy + SGB + Link)
          lcc -msm83:gb -Wl-yt0x1B -Wl-yo4 -Wl-js -o dmg_b.ihx BGC-BLAST-GB.c
          makebin -Z -ys -yt 0x1B -yo 4 -js dmg_b.ihx rom_outputs/bgc_blast_DMG.gb

          # 2. CGB Sürümü (Game Boy Color + SGB + Link)
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o cgb_b.ihx BGC-BLAST-GB.c
          makebin -Z -yc -ys -yt 0x1B -yo 4 -js cgb_b.ihx rom_outputs/bgc_blast_CGB.gb

          # 3. GBA Sürümü (Game Boy Advance Optimize + SGB + Link)
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o gba_b.ihx BGC-BLAST-GB.c
          makebin -Z -yC -ys -yt 0x1B -yo 4 -js gba_b.ihx rom_outputs/bgc_blast_GBA.gb

          # 4. "ALL" MANTIĞI: Tüm cihazlarda çalışan tek evrensel master ROM (KGAMER Universal)
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o all_b.ihx BGC-BLAST-GB.c
          makebin -Z -yc -ys -yt 0x1B -yo 4 -js all_b.ihx rom_outputs/bgc_blast_ALL.gb

      - name: Upload All and Universal ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kgamer-bgc-blast-all-roms
          path: rom_outputs/
