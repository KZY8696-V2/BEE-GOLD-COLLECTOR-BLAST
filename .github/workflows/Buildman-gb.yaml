name: BGC Blast Multi-Target ROMs with Link & SGB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all-roms-link:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile Separate ROMs (Featuring SGB, SNES Gamepad & Link Cable Support)
        run: |
          # Ortak Bayraklar:
          # -Wl-js / -js -> Super Game Boy & SNES Controller protokolü
          # -Wl-yt0x1B   -> MBC5 (Link skoru ve veri alışverişi için gereken ek RAM/ROM bankası desteği)
          
          # 1. Orijinal Game Boy (DMG) + SGB + Link Destekli Sürüm
          lcc -msm83:gb -Wl-yt0x1B -Wl-yo4 -Wl-js -o dmg_link.ihx BGC-BLAST-GB.c
          makebin -Z -ys -yt 0x1B -yo 4 -js dmg_link.ihx bgc_blast_dmg_link.gb

          # 2. Game Boy Color (CGB) + SGB + Link Destekli Sürüm
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o cgb_link.ihx BGC-BLAST-GB.c
          makebin -Z -yc -ys -yt 0x1B -yo 4 -js cgb_link.ihx bgc_blast_gbc_link.gb

          # 3. Game Boy Advance (GBA) + SGB + Link Destekli Sürüm (GBA link kablosu ve çoklu oyuncu hızlandırması tam uyumlu)
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o gba_link.ihx BGC-BLAST-GB.c
          makebin -Z -yC -ys -yt 0x1B -yo 4 -js gba_link.ihx bgc_blast_gba_link.gb

          # Çıktı klasörünü organize et
          New-Item -ItemType Directory -Force -Path "build_output"
          Move-Item "*.gb" "build_output\"

      - name: Upload Link-Enabled ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-link-and-sgb-roms
          path: build_output/
