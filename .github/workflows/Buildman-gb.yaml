name: BGC Blast Final Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-gameboy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020 (Windows Binaries)
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile C Code with LCC (MBC5, SGB & CGB Support)
        run: |
          # Geçici dizin ve dosya çakışmalarını önlemek için tam yollarla derleme
          $outputPath = "$PWD\bgc_blast.gb"
          $sourcePath = "$PWD\BGC-BLAST-GB.c"
          lcc -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o "$outputPath" "$sourcePath"


      - name: Upload Final Game Boy ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-final-rom
          path: bgc_blast.gb
