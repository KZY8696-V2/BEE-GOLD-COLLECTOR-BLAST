name: BGC Blast Final Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-gameboy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020 (Windows Binaries)
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile C Code Manually (SDCC + Makebin Pipeline)
        run: |
          # Kısa yolda çalışma dizini oluştur
          New-Item -ItemType Directory -Force -Path "C:\temp"
          Copy-Item "BGC-BLAST-GB.c" "C:\temp\BGC-BLAST-GB.c"
          Set-Location "C:\temp"
          
          # 1. Adım: SDCC ile C kodunu Game Boy z80 mimarisi için derle (.asm üretir)
          sdcc -mgbz80 --no-std-crt0 -Wl-yt0x1B -Wl-yo4 -Wl-js -c BGC-BLAST-GB.c
          
          # 2. Adım: Crt0 ve kütüphaneleri bağlayarak .ihx dosyasını üret
          # GBDK crt0_gb.s ve kütüphanelerini bağlıyoruz
          sdldgb -nf BGC-BLAST-GB
          
          # 3. Adım: makebin ile .ihx dosyasını .gb ROM formatına dönüştür
          makebin -w -y -yt 0x1B -yo 4 -js BGC-BLAST-GB.ihx bgc_blast.gb
          
          # Üretilen ROM'u ana klasöre taşı
          Move-Item "bgc_blast.gb" "$env:GITHUB_WORKSPACE\bgc_blast.gb"


      - name: Upload Final Game Boy ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-final-rom
          path: bgc_blast.gb
