name: BGC Blast Final Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-gameboy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract GBDK 2020 (Windows Binaries)
        run: |
          $gbdkUrl = "https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-win64.zip"
          $outputPath = "$env:TEMP\gbdk-win64.zip"
          Invoke-WebRequest -Uri $gbdkUrl -OutFile $outputPath
          Expand-Archive -Path $outputPath -DestinationPath "C:\" -Force
          echo "C:\gbdk\bin" >> $env:GITHUB_PATH

      - name: Compile C Code with LCC and Makebin
        run: |
          # 1. Adım: C kodunu doğrudan .ihx formatına derle
          lcc -msm83:gb -Wm-yc -Wl-yt0x1B -Wl-yo4 -Wl-js -o bgc_blast.ihx BGC-BLAST-GB.c
          
          # 2. Adım: .ihx dosyasını .gb ROM dosyasına dönüştür
          makebin -w -y -yt 0x1B -yo 4 -js bgc_blast.ihx bgc_blast.gb

      - name: Upload Final Game Boy ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgc-blast-final-rom
          path: bgc_blast.gb
